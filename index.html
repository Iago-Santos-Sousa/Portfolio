    <script>
      // Aplica o tema antes da primeira pintura para evitar flash (FOUC).
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          // "dark-theme" mantém compatibilidade com a versão anterior.
          var isDark = stored
            ? stored === "dark" || stored === "dark-theme"
            : prefersDark;
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
