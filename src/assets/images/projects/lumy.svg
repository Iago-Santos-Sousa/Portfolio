<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">Lumy: dashboard com gráfico de consumo e economia de energia elétrica</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect x="48" y="40" width="544" height="248" rx="16" fill="#ffffff"/>
  <!-- Cards -->
  <g font-family="sans-serif">
    <rect x="72" y="64" width="150" height="56" rx="10" fill="#eff6ff"/>
    <text x="86" y="88" font-size="12" fill="#475569">Consumo (kWh)</text>
    <text x="86" y="110" font-size="18" font-weight="700" fill="#1d4ed8">526</text>
    <rect x="238" y="64" width="150" height="56" rx="10" fill="#ecfdf5"/>
    <text x="252" y="88" font-size="12" fill="#475569">Economia GD (R$)</text>
    <text x="252" y="110" font-size="18" font-weight="700" fill="#047857">312,48</text>
  </g>
  <!-- Bars -->
  <g fill="url(#bar)">
    <rect x="84" y="208" width="28" height="56" rx="6"/>
    <rect x="128" y="184" width="28" height="80" rx="6"/>
    <rect x="172" y="196" width="28" height="68" rx="6"/>
    <rect x="216" y="160" width="28" height="104" rx="6"/>
    <rect x="260" y="176" width="28" height="88" rx="6"/>
    <rect x="304" y="150" width="28" height="114" rx="6"/>
  </g>
  <path d="M98 220 142 200 186 206 230 172 274 182 318 152" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bolt -->
  <g transform="translate(420 72)">
    <circle cx="74" cy="96" r="74" fill="#d1fae5"/>
    <path d="M86 38 46 108h30l-10 50 44-72H78z" fill="#10b981"/>
  </g>
  <text x="48" y="328" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">Lumy</text>
  <text x="122" y="328" font-family="monospace" font-size="16" fill="#a7f3d0">PDF → PostgreSQL → Chart.js</text>
</svg>
